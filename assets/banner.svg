      <stop stop-color="#181a1c"/>
      <stop offset="1" stop-color="#090b0d"/>
    </linearGradient>
    <linearGradient id="orange" x2="1" y2="1">
      <stop stop-color="#ffad71"/>
      <stop offset=".5" stop-color="#ff7b38"/>
      <stop offset="1" stop-color="#ee4e21"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
