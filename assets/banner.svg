<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
  <title id="title">BMAi — IA que faz parte do seu negócio</title>
  <desc id="desc">Banner institucional em preto e laranja. Engenharia de IA e tecnologia para empresas. Estratégia, desenvolvimento e operação.</desc>
  <defs>
